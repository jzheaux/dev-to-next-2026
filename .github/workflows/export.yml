name: Presentation - Export

on:
  workflow_dispatch:
  push:
    paths: [presentation.md, images/**]
  
permissions:
  contents: write
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jzheaux/reader@5bf50b7af35fc962345e5db26012fc12d268c09a # main
        with:
          files: presentation.md
